kind = "web"
previewPath = "/"
title = "Ветеринар на дом"
description = "Профессиональная ветеринарная помощь у вас дома: услуги, врачи, питомцы и заявки в одном приложении."
version = "1.0.0"
id = "artifacts/vethome-miniapp"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21197

[services.development]
run = "pnpm --filter @workspace/vethome-miniapp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vethome-miniapp", "run", "build" ]
serve = "static"
publicDir = "artifacts/vethome-miniapp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21197"
BASE_PATH = "/"
